<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Research Orchestrator</title>
<style>
  :root {
    --bg: #f5f5f5;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-muted: #666666;
    --user-bubble: #0066cc;
    --user-text: #ffffff;
    --assistant-bubble: #e8e8e8;
    --assistant-text: #1a1a1a;
    --border: #dddddd;
    --accent: #0066cc;
    --notice-bg: #e8f5e9;
    --notice-border: #4caf50;
    --notice-text: #2e7d32;
    --error-text: #d32f2f;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --surface: #2d2d2d;
      --text: #e0e0e0;
      --text-muted: #999999;
      --user-bubble: #1a73e8;
      --user-text: #ffffff;
      --assistant-bubble: #3a3a3a;
      --assistant-text: #e0e0e0;
      --border: #444444;
      --accent: #4da6ff;
      --notice-bg: #1b3a1b;
      --notice-border: #4caf50;
      --notice-text: #81c784;
      --error-text: #ef5350;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    width: 100%;
    max-width: 720px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
  }

  header {
    padding: 20px 0 12px;
    text-align: center;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 1.3rem;
    font-weight: 600;
  }

  header p {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 4px;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .message {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .message.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }

  .message.assistant {
    align-self: flex-start;
    background: var(--assistant-bubble);
    color: var(--assistant-text);
    border-bottom-left-radius: 4px;
  }

  .typing-indicator {
    align-self: flex-start;
    padding: 10px 14px;
    background: var(--assistant-bubble);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    display: none;
    gap: 4px;
  }

  .typing-indicator.visible { display: flex; }

  .typing-indicator span {
    width: 8px;
    height: 8px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
  }

  .typing-indicator span:nth-child(1) { animation-delay: 0s; }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  #notice {
    display: none;
    background: var(--notice-bg);
    border: 1px solid var(--notice-border);
    color: var(--notice-text);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 8px;
    line-height: 1.5;
  }

  #notice.visible { display: block; }

  .input-area {
    display: flex;
    gap: 8px;
    padding: 12px 0 20px;
    flex-shrink: 0;
  }

  #input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
  }

  #input:focus { border-color: var(--accent); }

  #send {
    padding: 0 20px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    flex-shrink: 0;
  }

  #send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>AI Research Orchestrator</h1>
    <p>Describe your project or problem. The orchestrator will clarify it with you.</p>
  </header>

  <div id="chat">
    <div class="typing-indicator" id="typing">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div id="notice"></div>

  <div class="input-area">
    <textarea id="input" rows="1" placeholder="Describe your problem or idea…"></textarea>
    <button id="send">Send</button>
  </div>
</div>

<script>
  const sessionId = crypto.randomUUID();
  const chatEl = document.getElementById("chat");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const typingEl = document.getElementById("typing");
  const noticeEl = document.getElementById("notice");
  let busy = false;

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "message " + role;
    div.textContent = text;
    chatEl.insertBefore(div, typingEl);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || busy) return;

    addMessage("user", text);
    inputEl.value = "";
    inputEl.style.height = "auto";
    busy = true;
    sendBtn.disabled = true;
    typingEl.classList.add("visible");
    chatEl.scrollTop = chatEl.scrollHeight;

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      const data = await res.json();
      addMessage("assistant", data.reply);

      if (data.finalized) {
        noticeEl.textContent =
          "\u2705 Research specification saved!\n" +
          "\u2022 " + data.output_dir + "/clarified_problem_statement.md\n" +
          "\u2022 " + data.output_dir + "/research_spec.json";
        noticeEl.classList.add("visible");
        inputEl.disabled = true;
        sendBtn.disabled = true;
        inputEl.placeholder = "Session finalized.";
      }
    } catch (err) {
      addMessage("assistant", "Error: " + err.message);
    } finally {
      busy = false;
      if (!inputEl.disabled) sendBtn.disabled = false;
      typingEl.classList.remove("visible");
    }
  }

  sendBtn.addEventListener("click", send);

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  // Auto-resize textarea
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });
</script>
</body>
</html>
